<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="450" viewBox="0 0 1200 450"><rect width="1200" height="450" rx="24" fill="#f7f2f1"/><text x="40" y="55" font-family="Arial,sans-serif" font-size="26" font-weight="700" fill="#171717">Equipos · tres alternativas</text><text x="40" y="85" font-family="Arial,sans-serif" font-size="16" fill="#656565">Mismo trazo y color del club. Ninguna sustituye todavía al icono actual.</text><rect x="40" y="120" width="350" height="290" rx="22" fill="white" stroke="#e1dce0"/><svg x="165" y="152" width="100" height="100" viewBox="0 0 52 52" fill="none" stroke="#ac1422" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="26" cy="16" r="7"/><circle cx="9" cy="22" r="5"/><circle cx="43" cy="22" r="5"/><path d="M14 46V35a12 12 0 0 1 24 0v11M2 46V36a7 7 0 0 1 9-7M50 46V36a7 7 0 0 0-9-7"/></svg><text x="215" y="300" text-anchor="middle" font-family="Arial,sans-serif" font-size="22" font-weight="700" fill="#171717">A · Grupo de jugadores</text><text x="215" y="337" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" fill="#656565">La más directa y fácil de reconocer</text><rect x="425" y="120" width="350" height="290" rx="22" fill="white" stroke="#e1dce0"/><svg x="550" y="152" width="100" height="100" viewBox="0 0 52 52" fill="none" stroke="#ac1422" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M26 4 45 11v15c0 11-9 19-19 23C16 45 7 37 7 26V11Z"/><circle cx="26" cy="20" r="5"/><path d="M17 35v-3a9 9 0 0 1 18 0v3"/></svg><text x="600" y="300" text-anchor="middle" font-family="Arial,sans-serif" font-size="22" font-weight="700" fill="#171717">B · Escudo de equipo</text><text x="600" y="337" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" fill="#656565">Identidad de grupo, sin usar una</text><text x="600" y="360" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" fill="#656565">camiseta</text><rect x="810" y="120" width="350" height="290" rx="22" fill="white" stroke="#e1dce0"/><svg x="935" y="152" width="100" height="100" viewBox="0 0 52 52" fill="none" stroke="#ac1422" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="6" y="5" width="40" height="42" rx="5"/><circle cx="17" cy="17" r="3"/><circle cx="17" cy="27" r="3"/><circle cx="17" cy="37" r="3"/><path d="M26 17h12M26 27h12M26 37h12"/></svg><text x="985" y="300" text-anchor="middle" font-family="Arial,sans-serif" font-size="22" font-weight="700" fill="#171717">C · Plantilla</text><text x="985" y="337" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" fill="#656565">Más centrada en la gestión de</text><text x="985" y="360" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" fill="#656565">jugadores</text></svg>